name: deploy react
on:
  push:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
      - run: docker build -t aserahmed/docker-react -f dockerfile.dev .
      - run: docker run -e CI=true aserahmed/docker-react npm run test
      
