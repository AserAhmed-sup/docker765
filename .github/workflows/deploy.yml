name: deploy react

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t asercodesmaybe/docker-react -f Dockerfile.dev .

      - name: Run tests
        run: docker run -e CI=true asercodesmaybe/docker-react npm run test

      - name: Build microservices
        run: |
          docker build -t asercodesmaybe/multi-client ./microservices/client
          docker build -t asercodesmaybe/multi-nginx ./microservices/nginx
          docker build -t asercodesmaybe/multi-server ./microservices/server
          docker build -t asercodesmaybe/multi-worker ./microservices/worker

      - run: docker push asercodesmaybe/multi-client
      - run: docker push asercodesmaybe/multi-nginx
      - run: docker push asercodesmaybe/multi-server
      - run: docker push asercodesmaybe/multi-worker

      - name: Generate deployment package
        run: |
          mkdir deploy
          cp package*.json deploy/
          cp -r public src deploy/
          cp Dockerfile deploy/
          cd deploy
          zip -r ../deploy.zip .

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: "reactDeploy"
          environment_name: "ReactDeploy-env "
          version_label: ${{ github.sha }}
          region: eu-north-1
          deployment_package: deploy.zip 